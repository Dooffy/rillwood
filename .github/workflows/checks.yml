# App + website checks, shared by CI (every push / PR) and Release. Expo doctor isn't here: it checks versions
# against Expo's online list, so it can fail with no change of ours - Release runs it on its own.
name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  app:
    # One independent runner per check type - each shows as its own status on the PR.
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check:
          - { name: Lint, run: npm run lint }
          - { name: Typecheck, run: npm run typecheck }
          - { name: Format, run: npm run format:check }
          - { name: Unit tests, run: npm test -- --ci --coverage }
          - { name: Bundle (iOS + Android), run: npm run bundle:check }
          - { name: Licences, run: npm run licenses }
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: ${{ matrix.check.name }}
        run: ${{ matrix.check.run }}

  web:
    name: Website build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
